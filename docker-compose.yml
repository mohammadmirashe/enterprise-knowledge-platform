services:
  api:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ekp_data:/app/data
      - ekp_storage:/app/storage
      - model_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ui:
    build: .
    init: true
    restart: unless-stopped
    command: streamlit run ui.py --server.address=0.0.0.0 --server.port=8501
    env_file: .env
    environment:
      API_URL: http://api:8000
      PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ekp_data:
  ekp_storage:
  model_cache:
